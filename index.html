<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>抽籤大樂透</title>
    <style>
      :root {
        --bg1: #fff1c1;
        --bg2: #ffb5a7;
        --card: rgba(255, 255, 255, 0.82);
        --primary: #ff6b6b;
        --primary-dark: #ef476f;
        --secondary: #ffd166;
        --text: #3a2d2d;
        --muted: #6d5b5b;
        --line: rgba(58, 45, 45, 0.1);
        --success: #06d6a0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", "Noto Sans TC", sans-serif;
        background: linear-gradient(135deg, var(--bg1), var(--bg2));
        color: var(--text);
      }

      .app {
        width: min(960px, 92vw);
        background: var(--card);
        border: 1px solid rgba(255,255,255,0.4);
        backdrop-filter: blur(10px);
        border-radius: 28px;
        box-shadow: 0 30px 60px rgba(111, 46, 46, 0.18);
        overflow: hidden;
      }

      .header {
        padding: 28px 32px 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        border-bottom: 1px solid var(--line);
      }

      .title-wrap {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .badge {
        width: 54px;
        height: 54px;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--secondary), var(--primary));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        box-shadow: 0 16px 24px rgba(255, 107, 107, 0.35);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.7rem, 2.4vw, 2.6rem);
      }

      .status {
        font-size: 0.9rem;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.6);
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid var(--line);
      }

      .content {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 0;
      }

      .panel {
        padding: 28px 32px;
      }

      .panel + .panel {
        border-left: 1px solid var(--line);
      }

      .draw-box {
        background: linear-gradient(180deg, rgba(255,255,255,0.75), rgba(255,255,255,0.4));
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 24px 18px;
        text-align: center;
      }

      .label {
        display: block;
        font-weight: 700;
        font-size: 0.86rem;
        color: var(--muted);
        margin-bottom: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .winner {
        min-height: 132px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(2rem, 4vw, 4rem);
        font-weight: 800;
        letter-spacing: 0.08em;
        color: var(--primary-dark);
        text-shadow: 0 10px 25px rgba(239, 71, 111, 0.22);
        transition: transform 0.2s ease;
      }

      .winner.animate {
        transform: scale(1.04);
      }

      .actions {
        display: flex;
        gap: 12px;
        margin-top: 18px;
      }

      button {
        border: none;
        border-radius: 14px;
        padding: 13px 18px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .primary {
        flex: 1;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        box-shadow: 0 18px 30px rgba(239, 71, 111, 0.28);
      }

      .secondary {
        background: rgba(255, 209, 102, 0.22);
        color: var(--text);
        border: 1px solid rgba(255, 209, 102, 0.5);
      }

      .input-row {
        display: flex;
        gap: 10px;
        margin-top: 18px;
      }

      input {
        flex: 1;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 1rem;
        background: rgba(255,255,255,0.65);
        color: var(--text);
      }

      input:focus {
        outline: 2px solid rgba(255, 107, 107, 0.3);
        border-color: rgba(255, 107, 107, 0.4);
      }

      .list-box {
        margin-top: 18px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(255,255,255,0.45);
        min-height: 220px;
        padding: 12px;
      }

      .participants {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .participant {
        background: linear-gradient(135deg, rgba(255, 209, 102, 0.35), rgba(255, 107, 107, 0.12));
        border: 1px solid rgba(255, 107, 107, 0.15);
        border-radius: 999px;
        padding: 8px 12px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }

      .remove {
        width: 18px;
        height: 18px;
        padding: 0;
        border-radius: 50%;
        font-size: 0.85rem;
        background: rgba(58,45,45,0.08);
        color: var(--text);
      }

      .empty {
        min-height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        text-align: center;
        padding: 18px;
      }

      @media (max-width: 760px) {
        .content {
          grid-template-columns: 1fr;
        }

        .panel + .panel {
          border-left: none;
          border-top: 1px solid var(--line);
        }

        .header {
          flex-direction: column;
          align-items: flex-start;
        }

        .actions,
        .input-row {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <div class="title-wrap">
          <div class="badge">🎉</div>
          <h1>抽籤小工具</h1>
        </div>
        <div class="status" id="statusText">目前 5 位參加者</div>
      </div>

      <div class="content">
        <section class="panel">
          <div class="draw-box">
            <span class="label">幸運得主</span>
            <div class="winner" id="winnerText">等待抽籤</div>
          </div>

          <div class="actions">
            <button class="primary" id="drawBtn">開始抽籤</button>
            <button class="secondary" id="resetBtn">重置</button>
          </div>
        </section>

        <aside class="panel">
          <label class="label" for="nameInput">新增參加者</label>
          <div class="input-row">
            <input id="nameInput" type="text" maxlength="20" placeholder="輸入名字後按 Enter" />
            <button class="secondary" id="addBtn" type="button">加入</button>
          </div>

          <div class="list-box">
            <ul class="participants" id="participantsList"></ul>
            <div class="empty" id="emptyState">目前還沒有參加者，請先加入名單。</div>
          </div>
        </aside>
      </div>
    </div>

    <script>
      const participants = ["小明", "小華", "阿珍", "王大同", "琪琪"];
      const nameInput = document.getElementById("nameInput");
      const participantsList = document.getElementById("participantsList");
      const winnerText = document.getElementById("winnerText");
      const statusText = document.getElementById("statusText");
      const emptyState = document.getElementById("emptyState");
      const drawBtn = document.getElementById("drawBtn");
      const resetBtn = document.getElementById("resetBtn");
      const addBtn = document.getElementById("addBtn");

      let animationTimer = null;
      let isDrawing = false;

      function renderList() {
        participantsList.innerHTML = "";

        if (participants.length === 0) {
          emptyState.style.display = "flex";
          statusText.textContent = "目前 0 位參加者";
          return;
        }

        emptyState.style.display = "none";
        statusText.textContent = `目前 ${participants.length} 位參加者`;

        participants.forEach((name, index) => {
          const li = document.createElement("li");
          li.className = "participant";
          li.innerHTML = `
            <span>${name}</span>
            <button class="remove" type="button" aria-label="移除 ${name}" data-index="${index}">×</button>
          `;
          participantsList.appendChild(li);
        });
      }

      function addParticipant(name) {
        const trimmed = name.trim();
        if (!trimmed) return;

        const exists = participants.some((item) => item.toLowerCase() === trimmed.toLowerCase());
        if (exists) {
          alert("這個名字已經在名單裡了！");
          nameInput.focus();
          return;
        }

        participants.push(trimmed);
        renderList();
        nameInput.value = "";
        nameInput.focus();
      }

      function removeParticipant(index) {
        participants.splice(index, 1);
        renderList();
        if (participants.length === 0) {
          winnerText.textContent = "等待抽籤";
        }
      }

      function stopAnimation() {
        clearInterval(animationTimer);
        animationTimer = null;
        isDrawing = false;
        drawBtn.disabled = false;
        drawBtn.textContent = "開始抽籤";
        winnerText.classList.remove("animate");
      }

      function drawWinner() {
        if (participants.length === 0) {
          winnerText.textContent = "請先加入名單";
          return;
        }

        if (isDrawing) {
          return;
        }

        isDrawing = true;
        drawBtn.disabled = true;
        drawBtn.textContent = "抽籤中...";
        winnerText.classList.add("animate");

        let rounds = 0;
        animationTimer = setInterval(() => {
          const randomName = participants[Math.floor(Math.random() * participants.length)];
          winnerText.textContent = randomName;
          rounds += 1;

          if (rounds > 18) {
            clearInterval(animationTimer);
            const finalIndex = Math.floor(Math.random() * participants.length);
            winnerText.textContent = participants[finalIndex];
            setTimeout(() => {
              winnerText.classList.remove("animate");
              isDrawing = false;
              drawBtn.disabled = false;
              drawBtn.textContent = "重新抽籤";
            }, 250);
          }
        }, 80);
      }

      function resetAll() {
        stopAnimation();
        participants.length = 0;
        winnerText.textContent = "等待抽籤";
        renderList();
        nameInput.value = "";
        nameInput.focus();
      }

      nameInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          addParticipant(nameInput.value);
        }
      });

      addBtn.addEventListener("click", () => addParticipant(nameInput.value));
      drawBtn.addEventListener("click", drawWinner);
      resetBtn.addEventListener("click", resetAll);

      participantsList.addEventListener("click", (event) => {
        const removeButton = event.target.closest(".remove");
        if (!removeButton) return;
        const index = Number(removeButton.dataset.index);
        removeParticipant(index);
      });

      renderList();
    </script>
  </body>
</html>
